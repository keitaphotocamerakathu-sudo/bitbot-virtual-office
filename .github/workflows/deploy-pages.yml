name: Test and deploy Bitbot 17.0
on:
  push:
    branches: [main, rebuild-v10, multi-asset-v11, intraday-v12, evidence-v13, company-v14, owner-consent-v14-1, animated-office-v14-2, adaptive-v16, fix/market-data-v17]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: bitbot-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Financial engine and server security
        run: npm test
      - name: Verify archived research integrity
        run: node research/verify-v13.mjs && node research/verify-v16.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: intraday-research
          path: |
            assets/backtest-v12.json
            assets/research-v13.json
            assets/research-v16.json
      - name: Install browser dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser flows and mobile layout
        run: npm run test:ui
      - name: Public backend checks (no trades)
        run: node tests/backend-smoke.mjs
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: test
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepare web application
        run: |
          mkdir -p public-site/assets
          cp index.html bitbot-v6-cloud-config.js public-site/
          cp assets/*.mjs assets/*.css public-site/assets/
          cp assets/*.json public-site/assets/
          for file in bitkub-live.html bitkub-setup.html bitbot-login.html; do cp index.html "public-site/$file"; done
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public-site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
