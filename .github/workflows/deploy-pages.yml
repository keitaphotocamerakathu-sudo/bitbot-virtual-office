name: Test and deploy REA 31.0 Master Paper Engine
on:
  push:
    branches: [main, rebuild-v10, multi-asset-v11, intraday-v12, evidence-v13, company-v14, owner-consent-v14-1, animated-office-v14-2, adaptive-v16, fix/market-data-v17, feat/master-engine-v31]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: bitbot-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Financial engine and server security
        run: npm test
      - name: Verify archived research integrity
        run: node research/verify-v13.mjs && node research/verify-v16.mjs && node research/verify-master-v31.mjs
      - name: Build isolated paper container
        run: docker build -f services/rea/Dockerfile -t rea-paper:checks .
      - name: Container runtime and Compose checks
        run: |
          docker run --rm --network none --read-only --mount type=bind,src="$PWD/tests/rea-container-smoke.mjs",dst=/checks/smoke.mjs,readonly rea-paper:checks node /checks/smoke.mjs
          docker compose -f compose.rea.yaml config --quiet
      - name: Public backend WebSocket probe (no credentials)
        run: node tests/rea-ws-probe.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: intraday-research
          path: |
            assets/backtest-v12.json
            assets/research-v13.json
            assets/research-v16.json
            assets/master-research-v31.json
            research/data-v31.json.gz
      - name: Install browser dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Prepare browser for UI checks
        timeout-minutes: 5
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            chrome_path=$(command -v google-chrome)
            printf 'PLAYWRIGHT_CHROMIUM_EXECUTABLE=%s\n' "$chrome_path" >> "$GITHUB_ENV"
            "$chrome_path" --version
          else
            npx playwright install --with-deps chromium
          fi
      - name: Browser flows and mobile layout
        run: npm run test:ui
      - name: Public backend checks (no trades)
        run: node tests/backend-smoke.mjs
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: test
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepare web application
        run: |
          mkdir -p public-site/assets
          cp index.html legacy.html rea.html bitbot-v6-cloud-config.js public-site/
          cp assets/*.mjs assets/*.css public-site/assets/
          cp assets/*.json public-site/assets/
          cp bitkub-live.html bitkub-setup.html bitbot-login.html public-site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public-site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
